<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./style.css">
    <title>Sharkie</title>
    <script src="./classes/drawable-object.class.js"></script>
    <script src="./classes/movable-object.class.js"></script>
    <script src="./classes/enemy.class.js"></script>
    <script src="./classes/character.class.js"></script>
    <script src="./classes/jelly-fish.class.js"></script>
    <script src="./classes/puffer-fish.class.js"></script>
    <script src="./classes/endboss.class.js"></script>
    <script src="./classes/light.class.js"></script>
    <script src="./classes/background-object.class.js"></script>
    <script src="./classes/keyboard.class.js"></script>
    <script src="./classes/level.class.js"></script>
    <script src="./classes/status-bar.class.js"></script>
    <script src="./classes/bubble.class.js"></script>
    <script src="./classes/coin.class.js"></script>
    <script src="./classes/poison.class.js"></script>
    <script src="./classes/world.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./js/game.js"></script>
</head>

<body onload="init()">

    <div id="game" class="game">
        <canvas id="canvas" width="720" height="480">

        </canvas>
        <div id="startScreen" class="screen start-screen">
            <img class="start-sharkie" src="./img/1.Sharkie/1.IDLE/1.png" alt="Sharkie">
            <div class="start-icons">
                <button class="btn-icon" aria-label="Sound">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M11 5 6 9H2v6h4l5 4V5z"></path>
                        <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
                        <path d="M19 5a10 10 0 0 1 0 14"></path>
                    </svg>
                </button>
                <button class="btn-icon" aria-label="Fullscreen">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M8 3H3v5"></path>
                        <path d="M16 3h5v5"></path>
                        <path d="M3 16v5h5"></path>
                        <path d="M21 16v5h-5"></path>
                    </svg>
                </button>
            </div>
            <div class="start-menu">
                <h1 class="start-title">SHARKIE</h1>
                <p class="start-text">Dive in, collect poison and defeat the Orca!</p>
                <button class="btn btn-purple">START</button>
                <button class="btn btn-yellow">HOW TO PLAY</button>
            </div>
            <a class="legal-link" href="./impressum.html">Legal notice</a>
        </div>
    </div>

</body>

</html>
